    <link href="/_app/immutable/bundle.CAc2YyPC.js" rel="modulepreload">
		
		<link href="/_app/immutable/assets/bundle.DTWtZ0F5.css" rel="stylesheet">
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">
			<script>
				{
					__sveltekit_rweqse = {
						base: ""
					};

					const element = document.currentScript.parentElement;

					import("/_app/immutable/bundle.CAc2YyPC.js").then((app) => {
						app.start(element)
					});

					if ('serviceWorker' in navigator) {
						const script_url = '/service-worker.js';
						const policy = globalThis?.window?.trustedTypes?.createPolicy(
							'sveltekit-trusted-url',
							{ createScriptURL(url) { return url; } }
						);
						const sanitised = policy?.createScriptURL(script_url) ?? script_url;
						addEventListener('load', function () {
							navigator.serviceWorker.register(sanitised);
						});
					}
				}
			</script>
		</div>
  </body>
</html>
