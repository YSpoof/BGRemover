<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Remova o background das imagens sem esforço, tudo localmente no seu navegador." />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="BGRemover" />
    <meta
      property="og:type"
      content="website" />
    <meta
      property="og:url"
      content="https://bgremover.lzart.com.br/" />
    <meta
      property="og:description"
      content="Remova o background das imagens sem esforço, tudo localmente no seu navegador." />
    <meta
      property="og:image"
      content="https://bgremover.lzart.com.br/pwa/wide.png" />

    <!-- Twitter -->
    <meta
      property="twitter:card"
      content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://bgremover.lzart.com.br/" />
    <meta
      property="twitter:title"
      content="BGRemover" />
    <meta
      property="twitter:description"
      content="Remova o background das imagens sem esforço, tudo localmente no seu navegador." />
    <meta
      property="twitter:image"
      content="https://bgremover.lzart.com.br/pwa/wide.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
